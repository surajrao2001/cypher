<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true" fill="none">
  <title>Locked event poster wall</title>
  <defs>
    <radialGradient id="eg-haze" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FF6500" stop-opacity=".12"/>
      <stop offset="55%" stop-color="#FF6500" stop-opacity=".03"/>
      <stop offset="100%" stop-color="#FF6500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eg-plate" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a1b1a"/>
      <stop offset="70%" stop-color="#111211"/>
      <stop offset="100%" stop-color="#0D0E0D"/>
    </radialGradient>
    <linearGradient id="eg-poster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161716"/>
      <stop offset="100%" stop-color="#0D0E0D"/>
    </linearGradient>
    <filter id="eg-soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="eg-grain" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .95 0 0 0 0 .95 0 0 0 0 .93 0 0 0 .08 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="eg-rough" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="270" rx="310" ry="200" fill="url(#eg-haze)" filter="url(#eg-soft)"/>

  <!-- Poster wall layers -->
  <g aria-hidden="true">
    <g transform="translate(92 88) rotate(-11)" opacity=".55">
      <rect width="128" height="178" rx="3" fill="url(#eg-poster)" stroke="#F4F4F1" stroke-opacity=".1" stroke-width="1.5"/>
      <rect x="14" y="18" width="100" height="56" fill="#F4F4F1" fill-opacity=".05"/>
      <path d="M18 92 H110 M18 108 H86 M18 124 H98" stroke="#F4F4F1" stroke-opacity=".12" stroke-width="3"/>
      <path d="M22 148 H70" stroke="#FF6500" stroke-opacity=".35" stroke-width="4"/>
      <g fill="#F4F4F1" fill-opacity=".14" filter="url(#eg-rough)">
        <path d="M20 40 H48 V46 H20 Z M20 52 H40 V56 H20 Z"/>
      </g>
    </g>
    <g transform="translate(580 70) rotate(9)" opacity=".5">
      <rect width="118" height="168" rx="3" fill="#111211" stroke="#F4F4F1" stroke-opacity=".09" stroke-width="1.5"/>
      <rect x="12" y="16" width="94" height="48" fill="#FF6500" fill-opacity=".08"/>
      <path d="M16 84 H100 M16 100 H78" stroke="#F4F4F1" stroke-opacity=".1" stroke-width="3"/>
      <circle cx="59" cy="130" r="18" stroke="#F4F4F1" stroke-opacity=".12" stroke-width="2" stroke-dasharray="4 5"/>
    </g>
    <g transform="translate(150 250) rotate(-4)" opacity=".4">
      <rect width="100" height="140" rx="2" fill="#161716" stroke="#F4F4F1" stroke-opacity=".08"/>
      <path d="M14 30 H86 M14 48 H70" stroke="#F4F4F1" stroke-opacity=".1" stroke-width="2.5"/>
      <path d="M20 90 H50" stroke="#FF6500" stroke-opacity=".25" stroke-width="3"/>
    </g>
    <g transform="translate(540 260) rotate(6)" opacity=".38">
      <rect width="96" height="132" rx="2" fill="#0D0E0D" stroke="#F4F4F1" stroke-opacity=".08"/>
      <path d="M12 28 H84" stroke="#F4F4F1" stroke-opacity=".1" stroke-width="8"/>
      <path d="M18 70 H70 M18 86 H58" stroke="#F4F4F1" stroke-opacity=".09" stroke-width="2"/>
    </g>
    <!-- Center back poster -->
    <g transform="translate(268 78)" opacity=".62">
      <rect width="264" height="300" rx="4" fill="#111211" stroke="#F4F4F1" stroke-opacity=".12" stroke-width="1.75"/>
      <rect x="22" y="24" width="220" height="88" fill="#161716"/>
      <path d="M36 48 H200" stroke="#F4F4F1" stroke-opacity=".1" stroke-width="10"/>
      <path d="M36 140 H230 M36 160 H190 M36 180 H210" stroke="#F4F4F1" stroke-opacity=".1" stroke-width="3"/>
      <!-- torn edge -->
      <path d="M0 210 L18 206 L30 214 L48 208 L60 216 L0 230 Z" fill="#080908" fill-opacity=".55"/>
    </g>
  </g>

  <!-- Tape + stickers -->
  <g aria-hidden="true">
    <rect x="240" y="96" width="54" height="10" fill="#F4F4F1" fill-opacity=".12" transform="rotate(-18 267 101)"/>
    <rect x="520" y="118" width="48" height="9" fill="#FF6500" fill-opacity=".28" transform="rotate(12 544 122)"/>
    <rect x="190" y="320" width="36" height="36" rx="3" fill="#161716" stroke="#FF6500" stroke-opacity=".35" stroke-width="1.5" transform="rotate(-8 208 338)"/>
    <circle cx="610" cy="300" r="16" fill="#111211" stroke="#F4F4F1" stroke-opacity=".15" stroke-width="1.5"/>
  </g>

  <!-- Fragment typography (distressed, not UI) -->
  <g fill="#F4F4F1" fill-opacity=".11" filter="url(#eg-rough)" aria-hidden="true">
    <g transform="translate(110 120) rotate(-11) scale(0.55)">
      <path d="M0 0 H22 L28 8 V24 L22 32 H0 Z M8 8 H18 L20 10 V22 L18 24 H8 Z"/>
      <path d="M36 0 H56 V8 H46 V24 H56 V32 H36 Z"/>
      <path d="M64 0 H86 V8 H74 V12 H84 V20 H74 V24 H86 V32 H64 Z"/>
      <path d="M94 0 H116 V8 H104 V24 H116 V32 H94 Z"/>
      <path d="M124 0 H150 V8 H134 V12 H146 V20 H134 V24 H150 V32 H124 Z"/>
    </g>
    <g transform="translate(600 95) rotate(9) scale(0.5)">
      <path d="M0 0 H20 H28 V8 H10 V24 H28 V32 H0 Z"/>
      <path d="M36 0 H56 L64 12 L56 32 H36 V24 H48 L52 12 L48 8 H36 Z"/>
      <path d="M72 0 H102 V8 H92 V32 H82 V8 H72 Z"/>
      <path d="M110 0 H130 V12 H144 V0 H154 V32 H144 V20 H130 V32 H110 Z"/>
      <path d="M162 0 H182 L190 8 V24 L182 32 H162 Z M170 8 H180 L184 12 V20 L180 24 H170 Z"/>
      <path d="M198 0 H224 V8 H208 V12 H220 V20 H208 V24 H224 V32 H198 Z"/>
    </g>
    <g transform="translate(175 280) scale(0.42)" fill-opacity=".9">
      <path d="M0 2 H20 V10 H8 V22 H20 V30 H0 Z"/>
      <path d="M28 0 H48 V32 H38 V12 H28 Z" transform="translate(0 0)"/>
      <path d="M40 0 H50 L56 24 L62 0 H72 L62 32 H50 Z"/>
      <path d="M56 0" opacity="0"/>
    </g>
  </g>
  <g fill="#FF6500" fill-opacity=".22" filter="url(#eg-rough)" aria-hidden="true">
    <g transform="translate(560 340) scale(0.4)">
      <path d="M0 0 H40 V6 H0 Z M0 12 H28 V18 H0 Z"/>
      <path d="M48 0 H70 V32 H48 Z"/>
    </g>
  </g>

  <!-- Primary: recessed lock medallion -->
  <g aria-hidden="true">
    <circle cx="400" cy="268" r="92" fill="#080908" fill-opacity=".45"/>
    <circle cx="400" cy="268" r="82" fill="url(#eg-plate)" stroke="#F4F4F1" stroke-opacity=".16" stroke-width="2"/>
    <circle cx="400" cy="268" r="70" fill="none" stroke="#0D0E0D" stroke-width="6"/>
    <circle cx="400" cy="268" r="68" fill="none" stroke="#F4F4F1" stroke-opacity=".06" stroke-width="1"/>
    <!-- Orange outline lock (physical) -->
    <g transform="translate(400 268)" stroke="#FF6500" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <rect x="-22" y="-2" width="44" height="36" rx="5"/>
      <path d="M-12 -2 V-18 C-12 -32 12 -32 12 -18 V-2"/>
      <circle cx="0" cy="14" r="3.5" fill="#FF6500" stroke="none"/>
      <path d="M0 17.5 V24" stroke-width="3.5"/>
    </g>
    <!-- rivets -->
    <circle cx="348" cy="220" r="3" fill="#F4F4F1" fill-opacity=".18"/>
    <circle cx="452" cy="220" r="3" fill="#F4F4F1" fill-opacity=".18"/>
    <circle cx="348" cy="316" r="3" fill="#F4F4F1" fill-opacity=".18"/>
    <circle cx="452" cy="316" r="3" fill="#F4F4F1" fill-opacity=".18"/>
  </g>

  <!-- Soft floor shadow -->
  <ellipse cx="400" cy="430" rx="150" ry="18" fill="#000" fill-opacity=".35" filter="url(#eg-soft)"/>

  <g filter="url(#eg-grain)" opacity=".5" pointer-events="none" aria-hidden="true">
    <ellipse cx="400" cy="270" rx="320" ry="210" fill="#F4F4F1"/>
  </g>
</svg>
