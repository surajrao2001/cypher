<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true" fill="none">
  <title>Empty passes access waiting</title>
  <defs>
    <radialGradient id="pa-haze" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FF6500" stop-opacity=".14"/>
      <stop offset="50%" stop-color="#FF6500" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#FF6500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pa-pass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b1a"/>
      <stop offset="100%" stop-color="#0D0E0D"/>
    </linearGradient>
    <linearGradient id="pa-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6500" stop-opacity=".5"/>
      <stop offset="50%" stop-color="#FF6500" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#FF6500" stop-opacity=".4"/>
    </linearGradient>
    <filter id="pa-soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="pa-grain" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .95 0 0 0 0 .95 0 0 0 0 .93 0 0 0 .08 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="pa-rough" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" seed="2" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="270" rx="310" ry="200" fill="url(#pa-haze)" filter="url(#pa-soft)"/>

  <!-- Floor access mark -->
  <ellipse cx="400" cy="420" rx="100" ry="20" stroke="#F4F4F1" stroke-opacity=".08" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M400 400 V440 M380 420 H420" stroke="#FF6500" stroke-opacity=".25" stroke-width="2"/>

  <!-- Wristband strip -->
  <g aria-hidden="true">
    <path d="M120 300 C180 250 250 280 320 310" stroke="url(#pa-band)" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M140 295 C190 260 240 285 300 305" stroke="#F4F4F1" stroke-opacity=".08" stroke-width="2"/>
    <rect x="200" y="268" width="50" height="18" rx="2" fill="#111211" stroke="#F4F4F1" stroke-opacity=".15" transform="rotate(-18 225 277)"/>
  </g>

  <!-- Ticket sleeve / partial reveal -->
  <g transform="translate(280 140) rotate(-5)" aria-hidden="true">
    <rect width="280" height="200" rx="8" fill="#111211" stroke="#F4F4F1" stroke-opacity=".12" stroke-width="1.5"/>
    <!-- Pass sliding out -->
    <g transform="translate(30 20)">
      <rect width="220" height="160" rx="6" fill="url(#pa-pass)" stroke="#F4F4F1" stroke-opacity=".2" stroke-width="2"/>
      <rect x="16" y="16" width="120" height="28" fill="#FF6500" fill-opacity=".18"/>
      <!-- Abstract QR -->
      <g transform="translate(150 20)" fill="#F4F4F1" fill-opacity=".22">
        <rect width="40" height="40"/>
        <rect x="6" y="6" width="12" height="12" fill="#0D0E0D"/>
        <rect x="22" y="6" width="12" height="12" fill="#0D0E0D"/>
        <rect x="6" y="22" width="12" height="12" fill="#0D0E0D"/>
        <rect x="22" y="22" width="8" height="8" fill="#0D0E0D"/>
        <rect x="32" y="28" width="4" height="4"/>
      </g>
      <!-- Perforation -->
      <path d="M16 70 H204" stroke="#F4F4F1" stroke-opacity=".15" stroke-width="1.5" stroke-dasharray="4 5"/>
      <!-- Admission markings -->
      <path d="M16 90 H140 M16 108 H110" stroke="#F4F4F1" stroke-opacity=".12" stroke-width="3"/>
      <!-- Event stamp -->
      <circle cx="60" cy="135" r="18" stroke="#FF6500" stroke-opacity=".45" stroke-width="2" fill="#FF6500" fill-opacity=".08"/>
      <path d="M50 135 H70" stroke="#FF6500" stroke-opacity=".5" stroke-width="2"/>
    </g>
  </g>

  <!-- YOUR NEXT / FLOOR AWAITS (secondary) -->
  <g fill="#F4F4F1" fill-opacity=".14" filter="url(#pa-rough)" aria-hidden="true">
    <g transform="translate(500 360) scale(0.4)">
      <path d="M0 0 H80 V5 H0 Z M0 12 H55 V17 H0 Z"/>
    </g>
    <g transform="translate(500 390) scale(0.4)" fill="#FF6500" fill-opacity=".35">
      <path d="M0 0 H100 V5 H0 Z M0 12 H70 V17 H0 Z"/>
    </g>
  </g>

  <ellipse cx="400" cy="450" rx="160" ry="16" fill="#000" fill-opacity=".3" filter="url(#pa-soft)"/>

  <g filter="url(#pa-grain)" opacity=".45" pointer-events="none" aria-hidden="true">
    <ellipse cx="400" cy="280" rx="300" ry="200" fill="#F4F4F1"/>
  </g>
</svg>
