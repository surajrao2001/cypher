services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cypher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cypher
      POSTGRES_PASSWORD: cypher
      POSTGRES_DB: cypher
    ports:
      - "5432:5432"
    volumes:
      - cypher_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cypher -d cypher"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cypher-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cypher_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cypher_pg_data:
  cypher_redis_data:
